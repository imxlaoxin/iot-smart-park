# 日志配置
logging:
  # 日志级别配置
  level:
    # 全局日志级别
    root: info
    # spring事务管理日志
    # org.springframework.jdbc.support.JdbcTransactionManager: debug
    biz: debug
    iot: info
  # 日志分组
  group:
    biz: com.imxiaoxin.iot.controller, com.imxiaoxin.iot.service, com.imxiaoxin.iot.mapper
    iot: com.imxiaoxin.iot.mqtt
  file:
    # 相对路径
    path: iot-log

